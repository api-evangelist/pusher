specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Pusher
providerId: pusher
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Realtime
  - Plans
description: >-
  Pusher Channels publishes a long pricing ladder from a free Sandbox (200K msg/day, 100
  connections) up through Startup ($49), Pro ($99), Business ($299), Premium ($499), Growth
  ($699), Plus ($899), Growth Plus ($1199), and a sales-led Enterprise tier. Each tier specifies
  a daily message cap and a concurrent-connection cap. Beams pricing is separate and based on
  monthly active devices.
sources:
  - https://pusher.com/channels/pricing
  - https://pusher.com/beams/pricing
plans:
  - id: pusher-sandbox
    name: Sandbox
    type: freemium
    description: Free - 200K messages/day, 100 concurrent connections.
    entries:
      - label: Monthly subscription
        name: sandbox_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Daily messages
        name: sandbox_msg_day
        type: quota
        metric: messages_per_day
        limit: 200000
        timeFrame: day
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Concurrent connections
        name: sandbox_connections
        type: quota
        metric: concurrent_connections
        limit: 100
        timeFrame: continuous
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Standard support
  - id: pusher-startup
