description: Pusher is a realtime communication platform owned by MessageBird/Bird.
  Its primary product Channels provides pub/sub messaging over WebSocket and HTTP;
  Beams provides device push notifications. Authentication uses an app key + secret
  per Pusher app. Channels and Beams are still actively sold; the older Chatkit product
  was sunset.
apis:
- aid: pusher:channels-api
  name: Pusher Channels API
  tags:
  - Pub/Sub
  - WebSockets
  - HTTP
  - Messaging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api-{cluster}.pusher.com/apps/{app_id}
  humanURL: https://pusher.com/docs/channels
  description: Pub/sub channels over WebSocket (client) and HTTP (server publish).
    Public, private, and presence channels supported. WebSocket endpoint at ws-{cluster}.pusher.com.
    Cluster hostnames include eu, us2, us3, ap1, ap2, ap3, etc.
  properties:
  - type: Documentation
    url: https://pusher.com/docs/channels
  - type: Pricing
    url: https://pusher.com/channels/pricing
  - type: AsyncAPI
    url: asyncapi/pusher-asyncapi.yml
  - url: graphql/pusher-graphql.md
    type: GraphQL
  x-features:
  - Public, private, presence channels
  - End-to-end encryption (E2E)
  - Webhooks for events
  - Multi-region clusters
  x-use-cases:
  - In-app chat
  - Live dashboards
  - Realtime collaboration
- aid: pusher:beams-api
  name: Pusher Beams API
  tags:
  - Push Notifications
  - Mobile
  - Web Push
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://{instance_id}.pushnotifications.pusher.com
  humanURL: https://pusher.com/docs/beams
  description: Server API for sending iOS, Android, and Web push notifications via
    FCM, APNs, and Web Push.
  properties:
  - type: Documentation
    url: https://pusher.com/docs/beams
  - type: Pricing
    url: https://pusher.com/beams/pricing
  x-features:
  - Multi-platform push (iOS, Android, Web)
  - Authenticated user-targeted publishes
  - Device interest subscriptions
  x-use-cases:
  - Push to mobile apps
  - Web push notifications
