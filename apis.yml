  baseURL: https://api-{cluster}.pusher.com/apps/{app_id}
  humanURL: https://pusher.com/docs/channels
  description: >-
    Pub/sub channels over WebSocket (client) and HTTP (server publish). Public, private, and presence
    channels supported. WebSocket endpoint at ws-{cluster}.pusher.com. Cluster hostnames include eu, us2,
    us3, ap1, ap2, ap3, etc.
